name: Update fear index

on:
  schedule:
    # Mon-Sat 12:17 UTC (about 6:17 AM Central): FRED posts prior-day data overnight;
    # the Monday run catches Friday closes that FRED posts late.
    - cron: "17 12 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build data/fear.json from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build.py --out data/fear.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/fear.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "data: fear index $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
